<!-- Cookie-friendly embeds (GDPR / ePrivacy):
     Third-party iframes (YouTube, Google Maps/Drive, Vimeo) set cookies as soon
     as they load. This script intercepts them *before* they load and shows a
     click-to-load placeholder. When the visitor loads one source:
       * every embed from that same source on the page is loaded too, and
       * the choice is remembered in a first-party cookie, so on later pages and
         visits that source loads automatically (no more prompts).
     It runs automatically for any embed added in any post. YouTube is upgraded
     to the privacy-enhanced youtube-nocookie.com domain. -->
<script>
(function () {
  var BLOCK = /(?:\/\/(?:www\.)?youtube\.com|youtube-nocookie\.com|youtu\.be|\/\/(?:www\.)?google\.[a-z.]+\/maps|drive\.google\.com|player\.vimeo\.com)/i;
  var COOKIE = 'cc_embed_consent';
  var MAXAGE = 60 * 60 * 24 * 180; // remember for 180 days

  // --- consent store (shared with the Disqus include via window.CCEmbeds) ---
  function readConsent() {
    var m = document.cookie.match(/(?:^|;\s*)cc_embed_consent=([^;]*)/);
    return m ? decodeURIComponent(m[1]).split('|').filter(Boolean) : [];
  }
  function writeConsent(list) {
    document.cookie = COOKIE + '=' + encodeURIComponent(list.join('|')) +
      ';path=/;max-age=' + MAXAGE + ';SameSite=Lax';
  }
  function hasConsent(svc) { return readConsent().indexOf(svc) > -1; }
  function grantConsent(svc) {
    var l = readConsent();
    if (l.indexOf(svc) < 0) { l.push(svc); writeConsent(l); }
  }
  function resetConsent() { document.cookie = COOKIE + '=;path=/;max-age=0;SameSite=Lax'; }
  window.CCEmbeds = { has: hasConsent, grant: grantConsent, reset: resetConsent };

  function serviceName(u) {
    if (/youtube|youtu\.be/i.test(u)) return 'YouTube';
    if (/google\.[a-z.]+\/maps/i.test(u)) return 'Google Maps';
    if (/drive\.google/i.test(u)) return 'Google Drive';
    if (/vimeo/i.test(u)) return 'Vimeo';
    return 'a third party';
  }

  // Remove an iframe's src before the browser fetches it, stashing it for later.
  function neutralize(ifr) {
    if (ifr.getAttribute('data-embed-src')) return;
    var src = ifr.getAttribute('src');
    if (!src || !BLOCK.test(src)) return;
    src = src.replace(/\/\/(?:www\.)?youtube\.com\//i, '//www.youtube-nocookie.com/'); // privacy-enhanced
    ifr.setAttribute('data-embed-src', src);
    ifr.setAttribute('data-embed-service', serviceName(src));
    ifr.removeAttribute('src');
  }

  // Catch iframes as the parser inserts them (this callback runs before the
  // browser's "load the iframe" task, so no request is made).
  var mo = new MutationObserver(function (recs) {
    for (var i = 0; i < recs.length; i++) {
      var added = recs[i].addedNodes;
      for (var j = 0; j < added.length; j++) {
        var n = added[j];
        if (n.nodeType !== 1) continue;
        if (n.tagName === 'IFRAME') neutralize(n);
        else if (n.getElementsByTagName) {
          var inner = n.getElementsByTagName('iframe');
          for (var k = 0; k < inner.length; k++) neutralize(inner[k]);
        }
      }
    }
  });
  mo.observe(document.documentElement, { childList: true, subtree: true });

  function makePlaceholder(svc) {
    var ph = document.createElement('button');
    ph.type = 'button';
    ph.className = 'cc-embed cc-embed--overlay';
    ph.innerHTML =
      '<span class="cc-embed-play" aria-hidden="true">&#9658;</span>' +
      '<span class="cc-embed-title">Load ' + svc + ' content</span>' +
      '<span class="cc-embed-note">Hosted by ' + svc + ' (a third party). Loading it will ' +
      'also load every other ' + svc + ' item on the page and will set ' + svc + ' cookies. ' +
      'Your choice is saved as a cookie on your device, so you won’t be asked again.</span>';
    return ph;
  }

  function loadFrame(ifr) {
    if (!ifr.getAttribute('data-embed-src')) return;
    ifr.src = ifr.getAttribute('data-embed-src');
    ifr.removeAttribute('data-embed-src');
    ifr.style.display = '';
    if (ifr.__ph && ifr.__ph.parentNode) ifr.__ph.parentNode.removeChild(ifr.__ph);
  }

  // Load every still-pending embed from one source, and remember the choice.
  function loadService(svc) {
    grantConsent(svc);
    var frames = document.querySelectorAll('iframe[data-embed-src]');
    Array.prototype.forEach.call(frames, function (ifr) {
      if (ifr.getAttribute('data-embed-service') === svc) loadFrame(ifr);
    });
  }

  function build() {
    mo.disconnect();
    var frames = document.querySelectorAll('iframe[data-embed-src]');
    Array.prototype.forEach.call(frames, function (ifr) {
      var svc = ifr.getAttribute('data-embed-service') || 'a third party';

      // Give every embed a positioned container so the placeholder can overlay it.
      var parent = ifr.parentNode;
      var pstyle = (parent && parent.getAttribute && parent.getAttribute('style')) || '';
      var responsive = /padding-(top|bottom)/i.test(pstyle) && /position\s*:\s*relative/i.test(pstyle);
      var container;
      if (responsive) {
        container = parent;
      } else {
        var box = document.createElement('div');
        box.className = 'cc-embed-box';
        var w = parseInt(ifr.getAttribute('width'), 10);
        var h = parseInt(ifr.getAttribute('height'), 10);
        if (w && h) { box.style.maxWidth = w + 'px'; box.style.aspectRatio = w + ' / ' + h; }
        parent.insertBefore(box, ifr);
        box.appendChild(ifr);
        container = box;
      }

      // Already consented to this source? Load it straight away.
      if (hasConsent(svc)) { loadFrame(ifr); return; }

      ifr.style.display = 'none';
      var ph = makePlaceholder(svc);
      ifr.__ph = ph;
      container.appendChild(ph);
      ph.addEventListener('click', function () { loadService(svc); });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();
</script>
