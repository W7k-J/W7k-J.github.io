{% if site.disqus %}
<div class="comments">
	<div id="disqus_thread"></div>

	<!-- Click-to-load comments: Disqus is a third party and sets its own cookies,
	     so it only loads after the visitor opts in. The choice is remembered via
	     the shared consent cookie (window.CCEmbeds), so once loaded it loads
	     automatically on later pages and visits. -->
	<button type="button" class="cc-embed" id="cc-load-disqus">
		<span class="cc-embed-title">Load comments (Disqus)</span>
		<span class="cc-embed-note">Comments are powered by Disqus (a third party). Loading them will set Disqus cookies. Your choice is saved as a cookie on your device, so comments will load automatically next time.</span>
	</button>

	<script type="text/javascript">
	    (function () {
	        function loadDisqus() {
	            var btn = document.getElementById('cc-load-disqus');
	            if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
	            var disqus_shortname = '{{ site.disqus }}';
	            var dsq = document.createElement('script');
	            dsq.type = 'text/javascript'; dsq.async = true;
	            dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
	            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
	        }
	        var consented = window.CCEmbeds && window.CCEmbeds.has && window.CCEmbeds.has('Disqus');
	        if (consented) {
	            loadDisqus();
	        } else {
	            var btn = document.getElementById('cc-load-disqus');
	            if (btn) btn.addEventListener('click', function () {
	                if (window.CCEmbeds && window.CCEmbeds.grant) window.CCEmbeds.grant('Disqus');
	                loadDisqus();
	            });
	        }
	    })();
	</script>
	<noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</div>
{% endif %}
